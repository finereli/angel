<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Angel — plain human register, per call</title>
  <meta name="description" content="Rewrite dense AI prose into plain human register. $0.25, USDC on Base. No accounts, no keys — the payment is the key.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="ai-catalog" href="/.well-known/agent-card.json" type="application/json" />
  <link rel="alternate" type="application/json" href="/.well-known/x402" />
  <link rel="service-doc" href="/llms.txt" type="text/plain" />
  <link rel="describedby" href="/openapi.json" type="application/json" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebAPI",
    "name": "Angel's Rewrite",
    "description": "Rewrite any text in a human voice, not a model's. 25 cents per call, USDC on Base.",
    "url": "https://angel.finereli.com",
    "provider": { "@type": "Organization", "name": "Angel" },
    "offers": {
      "@type": "Offer",
      "price": "0.25",
      "priceCurrency": "USD"
    },
    "documentation": "https://angel.finereli.com/llms.txt"
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.ts"></script>
  <script>
    function setVh() {
      document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px');
    }
    setVh();
    window.addEventListener('resize', setVh);
    window.addEventListener('load', function() {
      setTimeout(setVh, 100);
      setTimeout(setVh, 300);
    });
  </script>
</body>
</html>
