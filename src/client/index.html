<!doctype html>
<!-- pwa-kit: shell/index.html v6 -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover for the safe areas; no user scaling because this is
         an app, not a page (a deliberate choice - see reference/shell.md). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />
    <title>Angel</title>
    <meta name="description" content="A companion agent with one continuous stream and a memory that compresses instead of forgetting." />

    <!-- Dark mode before first paint: the class must be on <html> before any
         CSS runs, or returning users see a white flash. See shared/lib/theme.ts. -->
    <script>
      (function () {
        var d = localStorage.getItem('angel.dark.v1');
        if (d === '1' || (d === null && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      })();
    </script>

    <meta name="theme-color" content="#6366f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Angel" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  </head>
  <body>
    <div id="app"></div>
    <!-- Captured here, before the bundle: the event fires before Svelte mounts
         and a component listener misses it. InstallBanner picks it up. -->
    <script>window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__pwaInstallPrompt=e})</script>
    <script type="module" src="./main.ts"></script>
    <script>
      function setVh() {
        document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px');
      }
      setVh();
      window.addEventListener('resize', setVh);
      window.addEventListener('load', function () {
        setTimeout(setVh, 100);
        setTimeout(setVh, 300);
      });
    </script>
  </body>
</html>
