<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#4f46e5"/>
  <!-- three stacked blades per wing, symmetrical about x=256; scaled down so Android crops leave margin -->
  <g id="icon" transform="translate(256 256) scale(0.8) translate(-256 -269)">
    <g id="left-wing">
      <polygon points="244,150 76,118 76,196 244,236" fill="#ffffff"/>
      <polygon points="244,262 100,238 100,306 244,334" fill="#a5b4fc"/>
      <polygon points="244,360 138,346 138,404 244,420" fill="#6366f1"/>
    </g>
    <g id="right-wing">
      <polygon points="268,150 436,118 436,196 268,236" fill="#ffffff"/>
      <polygon points="268,262 412,238 412,306 268,334" fill="#a5b4fc"/>
      <polygon points="268,360 374,346 374,404 268,420" fill="#6366f1"/>
    </g>
  </g>
</svg>
