<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c1-wing" x1="140" y1="380" x2="380" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="c1-halo" x1="180" y1="120" x2="332" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="c1-glow" cx="256" cy="256" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="c1-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <g id="bg">
    <rect x="0" y="0" width="512" height="512" rx="112" fill="#1a1a2e"/>
    <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#c1-glow)"/>
  </g>

  <g id="icon">
    <!-- soft glow underlay for the wing -->
    <g filter="url(#c1-soft)" opacity="0.7">
      <path d="M150 372
               C150 300 196 250 268 226
               C232 262 224 300 236 336
               C286 300 320 258 336 206
               C338 262 322 316 280 356
               C246 388 196 392 150 372 Z"
            fill="url(#c1-wing)"/>
    </g>

    <!-- the wing: sweeping upward, suggested feathers -->
    <path d="M150 372
             C150 300 196 250 268 226
             C232 262 224 300 236 336
             C286 300 320 258 336 206
             C338 262 322 316 280 356
             C246 388 196 392 150 372 Z"
          fill="url(#c1-wing)"/>

    <!-- feather separations, cut in with bg color -->
    <path d="M236 336 C258 314 274 286 286 252" fill="none" stroke="#1a1a2e" stroke-width="10" stroke-linecap="round"/>
    <path d="M196 356 C214 328 224 300 228 270" fill="none" stroke="#1a1a2e" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g id="halo">
    <!-- soft halo glow -->
    <ellipse cx="256" cy="120" rx="86" ry="34" fill="none" stroke="url(#c1-halo)" stroke-width="26" opacity="0.35" filter="url(#c1-soft)"/>
    <!-- crisp halo ring, tilted -->
    <ellipse cx="256" cy="120" rx="80" ry="30" fill="none" stroke="url(#c1-halo)" stroke-width="16"/>
  </g>
</svg>
